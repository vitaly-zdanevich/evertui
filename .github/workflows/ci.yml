name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: 1.94.0

jobs:
  badges:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test badge counter
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check README code badges are up to date
        run: python3 tools/code_badges.py --check

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-clippy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Vim for PTY integration tests
        run: |
          if ! command -v vim >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends vim-nox util-linux
          fi
          vim --version | head -n 2
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked

  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - run: bash tools/build_vendor_archive.sh vendor.tar.gz
      - run: |
          tar -tzf vendor.tar.gz .cargo/config.toml >/dev/null
          tar -tzf vendor.tar.gz vendor >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: vendor
          path: |
            vendor.tar.gz
            vendor.tar.gz.sha256

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            artifact_name: evertui-linux-x86_64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            artifact_name: evertui-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.rust_target }}"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --locked --release --bins --target "${{ matrix.rust_target }}"
      - name: Pack binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/evertui" dist/
          tar -C dist -czf "${{ matrix.artifact_name }}.tar.gz" evertui
          sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256
