[package]
name = "evertui"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Two-panel Evernote TUI with embedded real Vim, tag/notebook search, and metadata management"
license = "GPL-3.0-only"
repository = "https://github.com/vitaly-zdanevich/evertui"
homepage = "https://github.com/vitaly-zdanevich/evertui"
readme = "README.md"
keywords = ["evernote", "tui", "notes", "vim", "terminal"]
categories = ["command-line-utilities", "text-editors"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "docs/badges/**",
    "src/**",
    "tests/**",
]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
evernote = "0.1.2"
md5 = "0.8.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rustix = { version = "1.1.4", features = ["fs", "process", "pty", "termios"] }
thiserror = "2.0.19"
thrift = "0.17.0"
unicode-width = "0.2.2"
ureq = "3.3.0"
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
